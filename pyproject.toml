[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinylrip"
version = "0.1.0"
description = "Command-line vinyl ripper: record sides, split tracks, look up metadata, save tagged FLAC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
    "rich>=13",
    "mutagen>=1.46",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vinylrip = "vinylrip.cli:main"

[tool.setuptools.packages.find]
include = ["vinylrip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
